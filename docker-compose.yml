services:
  bootstrap:
    build: .
    image: kadlab:local
    command: ["-listen", "auto:8000"]
    stdin_open: true
    tty: true
    networks: [kademlia]
  node:
    image: kadlab:local
    command: ["-listen", "auto:0", "-bootstrap", "${KAD_BOOTSTRAP:-bootstrap:8000}", "-command-timeout", "2m"]
    depends_on: [bootstrap]
    network_mode: "service:bootstrap"
    stdin_open: true
    tty: true
networks:
  kademlia:
